services:
  - type: web
    name: contract-grade-tracker
    runtime: node
    region: ohio
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # Encrypts stored Canvas tokens. Rotating it invalidates them,
      # and instructors reconnect Canvas.
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: CANVAS_BASE_URL
        value: https://widener.instructure.com
